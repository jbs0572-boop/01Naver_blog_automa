name: Python tests and function coverage

on:
  pull_request:
  push:
    branches:
      - main
      - test/coverage-audit-20261024

permissions:
  contents: read

jobs:
  test:
    name: pytest / branch coverage / function inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'jsonschema[format-nongpl]>=4.26,<5' 'pytest>=9,<10' 'hypothesis>=6.165,<7' 'coverage>=7,<8'
          python -m pip freeze > pip-freeze.txt
      - name: Run every test with branch coverage
        run: python -m coverage run --branch --source=tools -m pytest -q
      - name: Export whole-repository function coverage
        run: |
          python -m coverage report -m
          python -m coverage json -o coverage.json
          python scripts/coverage_audit.py --coverage-json coverage.json --out function-coverage.json
      - name: Preserve reproducible coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-quality-evidence
          path: |
            coverage.json
            function-coverage.json
            pip-freeze.txt
          if-no-files-found: ignore
          retention-days: 14
