name: Blog v2 safe preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run v2 behavioral tests and document inventory
        run: |
          python -m pip install 'pytest>=9,<10'
          python -m pytest -q tests/test_blog_v2.py tests/test_naver_search_v2.py tests/test_review_site_v2.py tests/test_workflow_intend_docs.py
      - name: Generate deterministic offline preview
        run: |
          python -m tools.blog_v2 demo --output-root preview
          python -m tools.blog_v2 verify --folder "$(find preview -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test "$(find preview -name approval.json | wc -l)" -eq 0
          test "$(find preview -name naver-copy.md | wc -l)" -eq 0
          python -m tools.naver_search_v2 --query "블로그 자동화" --as-of 2026-10-22 --limit 3 > preview/naver-search-plan.json
          python -m tools.review_site_v2 --folder "$(find preview -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test "$(find preview -name preview.html | wc -l)" -eq 1
      - name: Install Korean font coverage for browser screenshots
        timeout-minutes: 4
        run: |
          set -eu
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$BROWSER" ]; then
            # Avoid an unbounded apt/network stall. Existing Korean fonts are
            # valid; otherwise install Noto CJK, then VERIFY before capture.
            if [ -z "$(fc-list :lang=ko family | head -n 1)" ]; then
              sudo timeout 90s apt-get update -qq
              sudo env DEBIAN_FRONTEND=noninteractive timeout 120s apt-get install -y -qq --no-install-recommends fonts-noto-cjk
              fc-cache -f
            fi
            test -n "$(fc-list :lang=ko family | head -n 1)"
          fi
      - name: Render responsive snapshots if Chrome is available
        run: |
          set -eu
          HTML_FILE="$(find preview -name preview.html -print -quit)"
          test -n "$HTML_FILE"
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$BROWSER" ]; then
            mkdir -p preview/screenshots
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --screenshot="$PWD/preview/screenshots/mobile.png" "file://$PWD/$HTML_FILE"
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --screenshot="$PWD/preview/screenshots/desktop.png" "file://$PWD/$HTML_FILE"
            test -s preview/screenshots/mobile.png
            test -s preview/screenshots/desktop.png
            fc-match -f '%{family}\n' ':lang=ko' > preview/korean-font.txt
            test -s preview/korean-font.txt
          else
            echo "No Chrome executable; real-browser visual verification pending" > preview/visual-validation.txt
          fi
      - name: Publish review-only artifact (not Naver)
        uses: actions/upload-artifact@v4
        with:
          name: blog-v2-offline-preview
          path: preview/
          if-no-files-found: error
          retention-days: 14
