name: V3 three-image editorial quality

on:
  pull_request:
    paths:
      - 'editorial_studio/v3/**'
      - 'tests/test_v3_engine.py'
      - '.github/workflows/v3-three-image-quality.yml'
      - 'workflows/ci/v3-three-image-quality/intend.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-offline-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real screenshot and test dependencies
        run: |
          python -m pip install 'pytest>=9,<10' 'Pillow>=12,<13' 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Validate every v3 role and required workflow intent
        run: |
          python -m pytest -q tests/test_v3_engine.py tests/test_workflow_intend_docs.py
      - name: Build offline five-category proof from synthetic test fixtures
        env:
          V3_FIXTURE_ONLY: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy, json, hashlib
          from editorial_studio.v3.engine import generate
          generator = runpy.run_path('tests/test_v3_engine.py')['build_fixture_archive']
          root = Path('v3-ci')
          fixture = generator(root)
          result = generate(fixture, root/'preview')
          assert result['status'] == 'PASS'
          assert result['images_total'] == 15 and result['screenshots_total'] == 10
          assert len(result['results']) == 5
          assert all(item['evaluation']['score'] >= 95 for item in result['results'])
          assert all(item['original_same_sha256'] and not item['mobile_qa']['issues']
                     and not item['desktop_qa']['issues'] for item in result['results'])
          assert all(not item['evaluation']['published']
                     and item['evaluation']['human_review'] == 'PENDING' for item in result['results'])
          (root/'preview'/'SYNTHETIC_TEST_ASSETS.txt').write_text(
              'This CI preview contains synthetic offline fixture photos, not real or user-approved originals. '
              'The full original-photo test is a separate input-dependent path.\n', encoding='utf-8')
          print('FIVE STYLES, FIFTEEN ROLES, 95-POINT MECHANICAL GATE: PASS')
          PY
      - name: Upload inspectable, synthetic-only browser proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v3-five-category-offline-synthetic-preview
          path: |
            v3-ci/preview/
          if-no-files-found: error
          retention-days: 14
