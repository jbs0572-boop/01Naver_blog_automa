name: Editorial studio offline 5x2 quality

on:
  pull_request:
    paths:
      - "editorial_studio/**"
      - "tests/test_editorial_*.py"
      - ".github/workflows/editorial-studio-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install offline image and test dependencies
        run: |
          python -m pip install 'pytest>=9,<10' 'coverage>=7,<8' 'playwright>=1.50,<2' -r editorial_studio/requirements.txt
          python -m playwright install chromium --with-deps
      - name: Unit and adapter regression
        run: |
          python -m coverage run --branch --source=editorial_studio -m pytest -q tests/test_editorial_studio.py tests/test_editorial_engine.py tests/test_editorial_discovery.py tests/test_editorial_evolution.py tests/test_editorial_traffic.py tests/test_editorial_cli_contracts.py tests/test_visual_capture.py tests/test_editorial_gallery.py
          python -m coverage report -m --fail-under=80
          python -m coverage json -o editorial-coverage.json
      - name: Frozen 5 categories times 2 topics benchmark
        run: |
          python -m editorial_studio.benchmark --cases editorial_studio/benchmarks/cases.json --out-dir editorial-ci
          test "$(find editorial-ci -name draft.md | wc -l)" -eq 10
          test "$(find editorial-ci -name cover-prompt.txt | wc -l)" -eq 10
          test "$(find editorial-ci -name preview.html | wc -l)" -eq 10
          test "$(find editorial-ci -name cover.png | wc -l)" -eq 0
          test "$(find editorial-ci -name approval.json | wc -l)" -eq 0
      - name: Upload local review artifacts (never blog publishing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-5x2-offline-quality
          path: |
            editorial-ci/
            editorial-coverage.json
          if-no-files-found: ignore
          retention-days: 14
