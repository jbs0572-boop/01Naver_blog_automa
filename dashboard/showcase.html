  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QA Console / Showcase</title><link rel="stylesheet" href="/styles.css"></head>
  <body><div class="shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">W</span><span>WORKFLOW <small>/ SHOWCASE</small></span></a><span class="environment">LOCAL · READ ONLY</span></header><main class="page-body showcase"><p class="overline">PRIMITIVE SHOWCASE</p><h1>상태와 예외를 먼저 봅니다.</h1><p class="lede">로딩, 빈 상태, 오류, 대기, 성공, 차단 표현을 한 화면에서 확인하는 QA용 표면입니다.</p><section class="showcase-grid"><article class="panel"><p class="overline">STATUS CHIPS</p><div class="chip-stack"><span class="chip chip-success">통과</span><span class="chip chip-warning">확인 대기</span><span class="chip chip-error">실패</span><span class="chip chip-info">정보</span></div></article><article class="panel"><p class="overline">BUTTON STATES</p><div class="cluster"><button class="button button-primary" type="button">읽기 새로고침</button><button class="button button-quiet" type="button" disabled>비활성</button></div><p class="helper">외부 쓰기 동작은 이 표면에 존재하지 않습니다.</p></article><article class="panel panel-empty"><span class="detail-mark">∅</span><h2>로그 없음</h2><p>실행이 아직 없을 때의 빈 상태입니다.</p></article><article class="panel panel-error"><span class="detail-mark">!</span><h2>로그를 읽지 못함</h2><p>원인과 다음 조치를 함께 표시합니다.</p></article></section></main><footer class="footer"><a href="/">← 실행 목록으로</a></footer></div></body>
